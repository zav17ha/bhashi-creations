<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bhashi Creations | Coming Soon</title>
  <meta name="description" content="Bhashi Creations. New website launching 25 November 2026, 6:30 PM Sri Lanka time." />
  <meta name="theme-color" content="#02040c" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Bhashi Creations | Coming Soon" />
  <meta property="og:description" content="Our new website launches 25 November 2026 at 6:30 PM Sri Lanka time." />
  <meta property="og:image" content="assets/banner.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Michroma&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #02040c;
      --bg-2: #060a1a;
      --ink: #f3f5fb;
      --ink-2: #b9c1da;
      --muted: #7a84a4;
      --line: rgba(185, 200, 255, 0.11);
      --line-2: rgba(185, 200, 255, 0.2);
      --blue: #2f5bff;
      --blue-hi: #7b96ff;
      --blue-glow: rgba(47, 91, 255, 0.45);
      --font-d: "Michroma", "Arial Black", sans-serif;
      --font-b: "Inter Tight", system-ui, sans-serif;
      --font-m: "JetBrains Mono", ui-monospace, monospace;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --gutter: clamp(16px, 4vw, 56px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      min-height: 100svh;
      font-family: var(--font-b);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    ::selection { background: var(--blue); color: #fff; }
    :focus-visible { outline: 2px solid var(--blue-hi); outline-offset: 3px; }

    /* background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(60% 55% at 75% 40%, rgba(23, 50, 190, 0.3) 0%, transparent 70%),
        radial-gradient(55% 50% at 0% 100%, rgba(18, 48, 120, 0.35) 0%, transparent 70%);
    }
    .dot-grid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -webkit-mask-image: radial-gradient(120% 90% at 50% 45%, #000 40%, transparent 100%);
      mask-image: radial-gradient(120% 90% at 50% 45%, #000 40%, transparent 100%);
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 var(--gutter);
    }

    header {
      display: flex;
      align-items: center;
      height: 84px;
    }
    .logo img { width: 140px; height: auto; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 0 48px;
    }
    .mark {
      width: clamp(110px, 14vw, 160px);
      aspect-ratio: 1;
      margin-bottom: 18px;
      -webkit-mask-image: radial-gradient(closest-side, #000 58%, transparent 100%);
      mask-image: radial-gradient(closest-side, #000 58%, transparent 100%);
      animation: float 7s ease-in-out infinite;
    }
    .mark img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes float { 50% { transform: translateY(-10px); } }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-m);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--blue-hi);
      margin: 0 0 18px;
    }
    .eyebrow::before { content: ""; width: 7px; height: 7px; background: var(--blue); box-shadow: 0 0 12px var(--blue-glow); }

    h1 {
      font-family: var(--font-d);
      font-weight: 400;
      text-transform: uppercase;
      font-size: clamp(1.9rem, 5vw, 3.8rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin: 0;
    }
    h1 span { color: var(--blue); }
    /* countdown */
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 1.4vw, 16px);
      width: min(640px, 100%);
      margin: clamp(32px, 5vw, 48px) auto 0;
    }
    .unit {
      position: relative;
      padding: clamp(16px, 2.4vw, 26px) 6px clamp(12px, 1.8vw, 18px);
      border: 1px solid var(--line-2);
      background: rgba(6, 10, 26, 0.72);
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
    }
    .unit::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--blue);
      transform-origin: left;
      transform: scaleX(var(--p, 0));
      transition: transform 0.9s linear;
    }
    .num {
      display: block;
      font-family: var(--font-d);
      font-size: clamp(1.7rem, 5.4vw, 3.4rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .num.tick { animation: tick 0.5s var(--ease-out); }
    @keyframes tick { from { opacity: 0.25; transform: translateY(-6px); } }
    .label {
      display: block;
      margin-top: 10px;
      font-family: var(--font-m);
      font-size: clamp(9.5px, 1vw, 11px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .when {
      margin-top: 24px;
      font-family: var(--font-m);
      font-size: 11.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .launched .when { display: none; }
    .launched .countdown { display: none; }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px 28px;
      padding: 22px 0 28px;
      border-top: 1px solid var(--line);
      font-family: var(--font-m);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    footer .craxe { color: var(--ink-2); transition: color 0.2s; }
    footer .craxe:hover { color: var(--blue-hi); }
    footer .craxe { border-bottom: 1px solid currentColor; }

    /* entrance */
    .reveal { opacity: 0; transform: translateY(16px); animation: in 0.9s var(--ease-out) forwards; animation-delay: var(--d, 0ms); }
    @keyframes in { to { opacity: 1; transform: none; } }

    @media (max-width: 560px) {
      header { height: 72px; }
      .logo img { width: 120px; }
      footer { justify-content: center; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><canvas class="dot-grid"></canvas></div>

  <div class="page">
    <header class="reveal">
      <a class="logo" href="./" aria-label="Bhashi Creations"><img src="assets/logo.png" alt="Bhashi Creations" width="640" height="304" /></a>
    </header>

    <main>
      <div class="mark reveal" style="--d: 80ms"><img src="assets/mark-3d.jpg" alt="" width="1400" height="1400" /></div>
      <p class="eyebrow reveal" style="--d: 160ms" id="eyebrow">Coming soon</p>
      <h1 class="reveal" style="--d: 240ms" id="headline">Where creativity <span>reigns.</span></h1>

      <div class="countdown reveal" style="--d: 360ms" role="timer" aria-live="off" aria-label="Time until launch">
        <div class="unit"><span class="num" id="d">00</span><span class="label">Days</span></div>
        <div class="unit"><span class="num" id="h">00</span><span class="label">Hours</span></div>
        <div class="unit"><span class="num" id="m">00</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="num" id="s">00</span><span class="label">Seconds</span></div>
      </div>

      <p class="when reveal" style="--d: 440ms">25.11.2026 · 6:30 PM Sri Lanka</p>
    </main>

    <footer class="reveal" style="--d: 520ms">
      <span>&copy; 2026 Bhashi Creations</span>
      <span>Web solutions by <a class="craxe" href="https://www.craxe.org" target="_blank" rel="noopener">Craxe</a></span>
    </footer>
  </div>

  <script>
    (function () {
      /* Launch moment: 25 November 2026, 6:30 PM Sri Lanka time (UTC+05:30).
         Written with its offset, so it is the same instant for every visitor. */
      var LAUNCH = new Date("2026-11-25T18:30:00+05:30").getTime();
      // For previewing the finished state: open the page with #launched at the end of the URL.
      if (location.hash === "#launched") LAUNCH = Date.now() - 1000;

      var root = document.documentElement;
      var els = { d: byId("d"), h: byId("h"), m: byId("m"), s: byId("s") };
      var last = {};
      function byId(id) { return document.getElementById(id); }
      function pad(n) { return n < 10 ? "0" + n : String(n); }

      var timer = null;
      function render() {
        var diff = LAUNCH - Date.now();
        if (diff <= 0) return launched();
        var total = Math.floor(diff / 1000);
        var parts = {
          d: Math.floor(total / 86400),
          h: Math.floor((total % 86400) / 3600),
          m: Math.floor((total % 3600) / 60),
          s: total % 60
        };
        var max = { h: 24, m: 60, s: 60 };
        for (var k in parts) {
          var v = pad(parts[k]);
          if (last[k] !== v) {
            els[k].textContent = v;
            els[k].classList.remove("tick");
            void els[k].offsetWidth; // restart the tick animation
            els[k].classList.add("tick");
            last[k] = v;
          }
          if (max[k]) els[k].parentNode.style.setProperty("--p", (1 - parts[k] / max[k]).toFixed(3));
        }
        document.title = parts.d + "d " + pad(parts.h) + "h " + pad(parts.m) + "m | Bhashi Creations";
      }
      function launched() {
        clearInterval(timer);
        root.classList.add("launched");
        byId("eyebrow").textContent = "Live now";
        byId("headline").innerHTML = "The wait is <span>over.</span>";
        document.title = "Bhashi Creations | We're live";
        // When the main website replaces this page, the refresh takes visitors straight to it.
        setTimeout(function () { location.reload(); }, 120000);
      }
      render();
      timer = setInterval(render, 1000);
      document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });
    })();

    /* Dot grid: evenly spaced tiny squares that drift away from the pointer and spring back.
       Animates only while dots are moving; static on touch screens and for reduced motion. */
    (function () {
      var canvas = document.querySelector(".dot-grid");
      var ctx = canvas.getContext("2d");
      var GAP = 24, SIZE = 2, RADIUS = 130, PUSH = 16;
      var interactive = matchMedia("(hover: hover) and (pointer: fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches;
      var w, h, cols, rows, ox0, oy0, offX, offY, velX, velY, glow, raf = 0, mx = -1e4, my = -1e4;

      function resize() {
        var dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Math.floor(w / GAP) + 1; rows = Math.floor(h / GAP) + 1;
        ox0 = (w - (cols - 1) * GAP) / 2; oy0 = (h - (rows - 1) * GAP) / 2;
        var n = cols * rows;
        offX = new Float32Array(n); offY = new Float32Array(n);
        velX = new Float32Array(n); velY = new Float32Array(n); glow = new Float32Array(n);
        draw();
      }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (var r = 0, i = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++, i++) {
            var g = glow[i], x = ox0 + c * GAP + offX[i], y = oy0 + r * GAP + offY[i];
            if (g > 0.02) {
              var s = SIZE + g * 1.5;
              ctx.fillStyle = "rgba(" + Math.round(160 - 113 * g) + "," + Math.round(180 - 89 * g) + ",255," + (0.16 + g * 0.74) + ")";
              ctx.fillRect(x - s / 2, y - s / 2, s, s);
            } else {
              ctx.fillStyle = "rgba(160,180,255,0.16)";
              ctx.fillRect(x - SIZE / 2, y - SIZE / 2, SIZE, SIZE);
            }
          }
        }
      }
      function step() {
        raf = 0;
        var moving = false;
        for (var r = 0, i = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++, i++) {
            var dx = ox0 + c * GAP - mx, dy = oy0 + r * GAP - my, d = Math.sqrt(dx * dx + dy * dy);
            var tx = 0, ty = 0, tg = 0;
            if (d < RADIUS && d > 0.01) { var f = 1 - d / RADIUS, k = f * f * PUSH; tx = dx / d * k; ty = dy / d * k; tg = f; }
            velX[i] = (velX[i] + (tx - offX[i]) * 0.14) * 0.74;
            velY[i] = (velY[i] + (ty - offY[i]) * 0.14) * 0.74;
            offX[i] += velX[i]; offY[i] += velY[i];
            glow[i] += (tg - glow[i]) * 0.18;
            if (Math.abs(velX[i]) > 0.01 || Math.abs(velY[i]) > 0.01 || Math.abs(offX[i] - tx) > 0.05 || Math.abs(offY[i] - ty) > 0.05 || Math.abs(glow[i] - tg) > 0.01) moving = true;
          }
        }
        draw();
        if (moving) raf = requestAnimationFrame(step);
      }
      function kick() { if (!raf) raf = requestAnimationFrame(step); }

      resize();
      addEventListener("resize", resize);
      if (interactive) {
        addEventListener("pointermove", function (e) { mx = e.clientX; my = e.clientY; kick(); }, { passive: true });
        document.addEventListener("pointerleave", function () { mx = my = -1e4; kick(); });
      }
    })();
  </script>
</body>
</html>
